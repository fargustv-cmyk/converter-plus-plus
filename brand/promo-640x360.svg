<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1230"/>
      <stop offset="1" stop-color="#1a0a40"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4d9cff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcc00"/>
      <stop offset="1" stop-color="#ffa500"/>
    </linearGradient>
  </defs>

  <!-- Dark gradient background -->
  <rect width="640" height="360" fill="url(#bg2)"/>

  <!-- Decorative blurred shapes -->
  <circle cx="540" cy="60" r="100" fill="#4d9cff" opacity="0.18"/>
  <circle cx="80" cy="320" r="140" fill="#7c3aed" opacity="0.2"/>

  <!-- Title -->
  <text x="60" y="130" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Converter</text>
  <rect x="345" y="92" width="84" height="42" rx="10" fill="url(#gold2)"/>
  <text x="387" y="123" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle">Pro</text>
  <text x="438" y="130" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" fill="url(#accent2)" letter-spacing="-1.5">++</text>

  <!-- Subtitle -->
  <text x="60" y="172" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#a0a8c0">Многоступенчатая конвертация валют</text>

  <!-- Chain mockup -->
  <g transform="translate(60, 210)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="200" height="44" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="22" cy="22" r="12" fill="#4d9cff"/>
    <text x="44" y="28" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">USD</text>
    <text x="180" y="28" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">100</text>

    <!-- Arrow + rate pill -->
    <text x="100" y="68" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7080a0" text-anchor="middle">↓ 1 USD = 86.27 EUR</text>

    <!-- Step 2 -->
    <rect x="0" y="78" width="200" height="44" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="22" cy="100" r="12" fill="#4d9cff"/>
    <text x="44" y="106" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">EUR</text>
    <text x="180" y="106" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="end">86.27</text>

    <text x="100" y="146" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#7080a0" text-anchor="middle">↓ 1 EUR = 82.54 RUB</text>

    <!-- Step 3 (result) -->
    <rect x="0" y="156" width="200" height="48" rx="14" fill="rgba(77,156,255,0.18)" stroke="#4d9cff" stroke-width="1.5"/>
    <circle cx="22" cy="180" r="12" fill="url(#gold2)"/>
    <text x="44" y="186" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff">RUB</text>
    <text x="180" y="188" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="end">7 120</text>
  </g>

  <!-- Right side: features -->
  <g transform="translate(310, 220)">
    <text x="0" y="0" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">▸ Курсы ЦБ РФ и крипта</text>
    <text x="0" y="30" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">▸ Своя комиссия и курс</text>
    <text x="0" y="60" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">▸ Двунаправленный ввод</text>
    <text x="0" y="90" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#a78bfa">▸ Светлая / тёмная тема</text>
  </g>
</svg>
